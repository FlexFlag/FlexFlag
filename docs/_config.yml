title: FlexFlag
description: High-performance, developer-first feature flag management with sub-millisecond evaluation and distributed edge servers.
url: https://flexflag.github.io
baseurl: /FlexFlag

remote_theme: just-the-docs/just-the-docs@v0.10.0

markdown: kramdown
highlighter: rouge

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-remote-theme

exclude:
  - node_modules/
  - vendor/

# just-the-docs configuration
color_scheme: dark

aux_links:
  "Live Demo":
    - "https://flex-flag-zyen-idpjh03va-reez-personals-projects.vercel.app/"
  "GitHub":
    - "https://github.com/FlexFlag/FlexFlag"

aux_links_new_tab: true

search_enabled: true
search:
  heading_level: 2
  previews: 3

nav_sort: order

footer_content: "Built with ❤️ by the FlexFlag team &nbsp;·&nbsp; <a href=\"https://discord.gg/fpewTJyx9S\">Discord</a>"

repository: FlexFlag/FlexFlag
github_username: flexflag
